name: Agent Cassette CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Lint Code
        run: npm run lint

      - name: Check TypeScript
        run: ./node_modules/.bin/tsc --noEmit

      - name: Run Unit Tests
        run: npm test

      - name: Verify Ordinary Demo (Replay Mode)
        run: npm run demo:replay
        env:
          OPENAI_API_KEY: ""
          CASSETTE_MODE: replay

      - name: Verify Node-RED Generator (Replay Mode)
        run: npm run nodered:replay
        env:
          OPENAI_API_KEY: ""
          CASSETTE_MODE: replay
